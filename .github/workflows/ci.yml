# X-Pan 移动端 CI/CD — x-pan-mobile 子仓库
#
# - Flutter analyze + test（静态分析 + 单元测试）
# - 四平台编译（作为整体门禁,任一步失败即标记失败）：
#   · Android APK   —— ubuntu  runner  flutter build apk
#   · iOS           —— macOS   runner  flutter build ios --no-codesign
#   · macOS         —— macOS   runner  flutter build macos
#   · Windows       —— windows runner  flutter build windows
# 注：GitHub 无法在 Linux 构建 iOS/macOS，故按宿主系统分配各平台 job。
name: X-Pan Mobile CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # —— 静态分析 + 单元测试（统一在 Linux 上快速执行） ——
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    # 全量单元/Widget 测试约 20 秒；15 分钟足够覆盖 pub get + 分析 + 测试。
    # 显式超时避免 Flutter 工具链偶发卡死把 job 拖到 GitHub 默认 6 小时上限。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 pubspec.lock 的最低要求对齐（Flutter 3.47 / Dart 3.13.1）；
          # 本地 3.50.1 已验证兼容，钉版本避免 stable 漂移导致工具链不一致。
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # 允许 info 级别提示（当前 68 条为 Flutter 3.47+ 的 material.dart 弃用迁移提示，
        # 1 条为既有 BuildContext 异步使用提示）；warning/error 仍然会让门禁失败。
        # 这样既能先固化门禁，又不会把已知技术债误判为红。
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # 依赖已在上一阶段显式安装；--no-pub 避免 flutter test 再次解析依赖时卡在网络，
        # 也避免与 CI 缓存中的 package_config 产生重复读取。全量 112 用例基线。
        run: flutter test --no-pub

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --no-banner -v

  # —— Android APK ——
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [ analyze-test ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 pubspec.lock 的最低要求对齐（Flutter 3.47 / Dart 3.13.1）；
          # 本地 3.50.1 已验证兼容，钉版本避免 stable 漂移导致工具链不一致。
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile-android

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # —— iOS ——
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [ analyze-test ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 pubspec.lock 的最低要求对齐（Flutter 3.47 / Dart 3.13.1）；
          # 本地 3.50.1 已验证兼容，钉版本避免 stable 漂移导致工具链不一致。
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile-ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

  # —— macOS ——
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [ analyze-test ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 pubspec.lock 的最低要求对齐（Flutter 3.47 / Dart 3.13.1）；
          # 本地 3.50.1 已验证兼容，钉版本避免 stable 漂移导致工具链不一致。
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile-macos

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --debug

  # —— Windows ——
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [ analyze-test ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 pubspec.lock 的最低要求对齐（Flutter 3.47 / Dart 3.13.1）；
          # 本地 3.50.1 已验证兼容，钉版本避免 stable 漂移导致工具链不一致。
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile-windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug