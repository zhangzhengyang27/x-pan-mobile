# 移动端真实后端集成测试（手动触发）
#
# 需要仓库 Secrets：
#   XPAN_IT_BASE_URL  后端地址（Android 模拟器访问公网/内网均需可达）
#   XPAN_IT_USERNAME  已注册的测试账号
#   XPAN_IT_PASSWORD  测试账号密码
#
# 未配置账号时测试内部会自动 skip；不会把凭据写入仓库或日志。
name: Mobile Integration Test

on:
  workflow_dispatch:

jobs:
  android-integration:
    name: Android integration_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
          cache-key: flutter-xpan-mobile-integration

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          XPAN_IT_BASE_URL: ${{ secrets.XPAN_IT_BASE_URL }}
          XPAN_IT_USERNAME: ${{ secrets.XPAN_IT_USERNAME }}
          XPAN_IT_PASSWORD: ${{ secrets.XPAN_IT_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: >-
            flutter test integration_test/api_flow_test.dart -d emulator-5554
            --dart-define=X_PAN_API_BASE_URL=$XPAN_IT_BASE_URL
            --dart-define=XPAN_IT_USERNAME=$XPAN_IT_USERNAME
            --dart-define=XPAN_IT_PASSWORD=$XPAN_IT_PASSWORD
